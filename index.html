<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rally Labs</title>
  <meta name="description" content="We make the algorithm physical. Rally Labs designs social experiences where strangers don't stay strangers. Now forming in Washington, DC.">
  <meta name="theme-color" content="#0E0A22">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Link previews (iMessage, Slack, LinkedIn, X) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rallylabs.ai/">
  <meta property="og:title" content="Rally Labs">
  <meta property="og:description" content="We make the algorithm physical. Now forming in Washington, DC.">
  <meta property="og:image" content="https://rallylabs.ai/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --night: #0E0A22;
      --dusk: #2B1C55;
      --ink: #EEEBFF;
      --haze: #A9A3CE;
      --teal: #00F5D4;
      --sky: #00A6FB;
      --violet: #8B3DFF;
      --pink: #FF2ECC;
      --spectrum: linear-gradient(90deg, var(--teal), var(--sky) 33%, var(--violet) 66%, var(--pink));
      --sans: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    html { background: var(--night); }

    body {
      min-height: 100svh;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(ellipse 75% 60% at 50% 46%, var(--dusk) 0%, #1B1240 42%, var(--night) 100%) fixed,
        var(--night);
      -webkit-font-smoothing: antialiased;
    }

    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 32px 16px calc(20px + env(safe-area-inset-bottom));
      pointer-events: none; /* let the sky feel the cursor everywhere */
    }
    .page a { pointer-events: auto; }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-bottom: 4vh;
    }

    h1 { line-height: 0; }

    .logo {
      width: min(800px, 88vw);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 0 36px rgba(139, 61, 255, 0.28));
    }

    .tagline {
      margin-top: clamp(1.25rem, 4vh, 2.5rem);
      font-weight: 300;
      font-size: clamp(1.3rem, 0.85rem + 2vw, 2.15rem);
      line-height: 1.2;
      letter-spacing: -0.025em;
      text-wrap: balance;
      text-shadow: 0 0 28px var(--night);
    }

    .rotator {
      display: grid;
      margin-top: 0.85rem;
      min-height: 1.5em;
      max-width: 34ch;
      font-weight: 300;
      font-size: clamp(0.98rem, 0.88rem + 0.55vw, 1.2rem);
      line-height: 1.4;
      letter-spacing: 0.005em;
      color: var(--haze);
      text-shadow: 0 0 24px var(--night);
    }
    .rotator .line { grid-area: 1 / 1; text-wrap: balance; }
    .rotator .w {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.4em);
      filter: blur(8px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.2,.7,.2,1), filter 0.8s ease;
      transition-delay: var(--d, 0ms);
    }
    .rotator .line.in .w { opacity: 1; transform: none; filter: none; }
    .rotator .line.out .w {
      opacity: 0;
      transform: translateY(-0.25em);
      filter: blur(6px);
      transition-duration: 0.5s;
      transition-delay: 0ms;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px 24px;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      font-size: 0.875rem;
      font-weight: 300;
      letter-spacing: 0.01em;
      color: var(--haze);
    }

    footer a {
      color: var(--ink);
      text-decoration: none;
      padding-bottom: 3px;
      background: var(--spectrum) no-repeat 0 100% / 100% 1px;
      transition: background-size 0.3s ease, color 0.3s ease;
    }
    footer a:hover { background-size: 100% 2px; color: #fff; }
    footer a:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    /* One orchestrated entrance */
    .reveal {
      opacity: 0;
      animation: arrive 1.4s cubic-bezier(.2,.7,.2,1) forwards;
      animation-delay: var(--at, 0ms);
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); filter: blur(12px); }
      to   { opacity: 1; transform: none; filter: none; }
    }

    @media (max-width: 560px) {
      .rotator { min-height: 2.6em; }
      footer { justify-content: center; text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: fade 0.8s ease forwards; animation-delay: 0ms; }
      @keyframes fade { to { opacity: 1; } }
      .rotator .w, .rotator .line.out .w { transform: none; filter: none; transition-delay: 0ms; }
    }
  </style>
</head>

      </h1>

      <p class="tagline reveal" style="--at: 900ms">We make the algorithm physical.</p>

      <p class="rotator" id="rotator" aria-hidden="true"></p>
      <p class="sr-only">Engineered serendipity. Strangers who don't stay strangers. Friends of friends of friends. The people you should already know. Rooms where everyone helps everyone. A smaller, more human world.</p>
    </main>

    <footer class="reveal" style="--at: 1700ms">
      <span>Now forming in Washington, DC</span>
      <a href="mailto:sean@rallylabs.ai?subject=Rally%20Labs%3A%20count%20me%20in">Want in? Say hello</a>
    </footer>
  </div>

  <script>
  (() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Rotating phrases (edit freely) ---------- */
    const phrases = [
      "Engineered serendipity.",
      "Strangers who don't stay strangers.",
      "Friends of friends of friends.",
      "The people you should already know.",
      "Rooms where everyone helps everyone.",
      "A smaller, more human world."
    ];
    const rot = document.getElementById('rotator');
    let idx = 0;

    function showPhrase() {
      const old = rot.querySelector('.line.in');
      if (old) {
        old.classList.replace('in', 'out');
        setTimeout(() => old.remove(), 600);
      }
      const line = document.createElement('span');
      line.className = 'line';
      phrases[idx].split(' ').forEach((word, k, all) => {
        const w = document.createElement('span');
        w.className = 'w';
        w.textContent = word;
        w.style.setProperty('--d', (reduce ? 0 : 280 + k * 75) + 'ms');
        line.appendChild(w);
        if (k < all.length - 1) line.appendChild(document.createTextNode(' '));
      });
      rot.appendChild(line);
      requestAnimationFrame(() => requestAnimationFrame(() => line.classList.add('in')));
      idx = (idx + 1) % phrases.length;
    }
    setTimeout(() => { showPhrase(); setInterval(showPhrase, 3600); }, reduce ? 0 : 1500);

    /* ---------- Constellation sky ---------- */
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');

    // Logo gradient as a lookup table, so lines take the color of where they sit
    const stops = [[0, [0, 245, 212]], [0.33, [0, 166, 251]], [0.66, [139, 61, 255]], [1, [255, 46, 204]]];
    const lut = Array.from({ length: 65 }, (_, i) => {
      const t = i / 64;
      let k = 0;
      while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
      const [ta, ca] = stops[k], [tb, cb] = stops[k + 1];
      const u = (t - ta) / (tb - ta);
      return ca.map((v, j) => Math.round(v + (cb[j] - v) * u)).join(',');
    });

    let W = 0, H = 0, link = 120, stars = [];
    const tint = x => lut[Math.max(0, Math.min(64, Math.round((x / W) * 64)))];
    const pointer = { x: 0, y: 0, on: false };

    function makeStar() {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.004 + Math.random() * 0.01;          // px per ms
      const linker = Math.random() < 0.5;
      return {
        x: Math.random() * W, y: Math.random() * H,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        r: linker ? 0.9 + Math.random() * 1.1 : 0.4 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        rate: 0.5 + Math.random() * 1.5,
        linker
      };
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      link = Math.max(90, Math.min(150, Math.sqrt(W * H) / 8.5));
      const count = Math.round(Math.max(60, Math.min(180, (W * H) / 7500)));
      while (stars.length < count) stars.push(makeStar());
      stars.length = count;
      for (const s of stars) { if (s.x > W) s.x = Math.random() * W; if (s.y > H) s.y = Math.random() * H; }
      if (reduce) frame(performance.now());
    }

    // Keep the middle calmer so the logo stays the star of the show
    function calm(x, y) {
      const k = Math.hypot((x - W / 2) / (W * 0.36), (y - H * 0.46) / (H * 0.3));
      return 0.3 + 0.7 * Math.min(1, k);
    }

    // A "small world" moment: two far-apart stars find each other
    let spark = null, nextSpark = performance.now() + 3200;
    function startSpark(now) {
      const pool = stars.filter(s => s.linker);
      // Distance from the hero's center to segment a-b, in "hero ellipse" units (<1 means it crosses the logo)
      const crossesHero = (a, b) => {
        const sx = W * 0.4, sy = H * 0.2, cx = W / 2, cy = H * 0.46;
        const ax = (a.x - cx) / sx, ay = (a.y - cy) / sy, bx = (b.x - cx) / sx, by = (b.y - cy) / sy;
        const dx = bx - ax, dy = by - ay;
        const t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / (dx * dx + dy * dy || 1)));
        return Math.hypot(ax + dx * t, ay + dy * t) < 1;
      };
      for (let tries = 0; tries < 80; tries++) {
        const a = pool[Math.random() * pool.length | 0], b = pool[Math.random() * pool.length | 0];
        if (a !== b && Math.hypot(a.x - b.x, a.y - b.y) > Math.min(W, H) * 0.45 && !crossesHero(a, b)) {
          spark = { a, b, t0: now };
          return;
        }
      }
    }
    function drawSpark(now) {
      const t = now - spark.t0, grow = 1100, hold = 900, fade = 1600;
      if (t > grow + hold + fade) { spark = null; nextSpark = now + 4500 + Math.random() * 4500; return; }
      const { a, b } = spark;
      const e = Math.min(1, t / grow), p = 1 - Math.pow(1 - e, 3);
      const alpha = t < grow + hold ? 1 : 1 - (t - grow - hold) / fade;
      const ex = a.x + (b.x - a.x) * p, ey = a.y + (b.y - a.y) * p;
      const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, `rgba(${tint(a.x)},${0.85 * alpha})`);
      g.addColorStop(1, `rgba(${tint(b.x)},${0.85 * alpha})`);
      ctx.save();
      ctx.strokeStyle = g; ctx.lineWidth = 1.25;
      ctx.shadowColor = `rgba(${tint((a.x + b.x) / 2)},${alpha})`; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(ex, ey); ctx.stroke();
      for (const [x, y, on] of [[a.x, a.y, 1], [ex, ey, e]]) {
        const glow = ctx.createRadialGradient(x, y, 0, x, y, 9);
        glow.addColorStop(0, `rgba(255,255,255,${0.9 * alpha * on})`);
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    let last = performance.now();
    const born = performance.now();
    function frame(now) {
      const dt = Math.min(50, now - last); last = now;
      const intro = reduce ? 1 : Math.min(1, (now - born) / 1800);
      ctx.clearRect(0, 0, W, H);

      if (!reduce) {
        for (const s of stars) {
          s.x += s.vx * dt; s.y += s.vy * dt;
          if (s.x < -20) s.x = W + 20; else if (s.x > W + 20) s.x = -20;
          if (s.y < -20) s.y = H + 20; else if (s.y > H + 20) s.y = -20;
        }
      }

      // Constellation lines between nearby stars
      ctx.lineWidth = 0.75;
      const L2 = link * link;
      for (let i = 0; i < stars.length; i++) {
        const a = stars[i]; if (!a.linker) continue;
        for (let j = i + 1; j < stars.length; j++) {
          const b = stars[j]; if (!b.linker) continue;
          const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
          if (d2 > L2) continue;
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          const alpha = (1 - Math.sqrt(d2) / link) * 0.42 * intro * calm(mx, my);
          ctx.strokeStyle = `rgba(${tint(mx)},${alpha})`;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }

      // You are a star too
      if (pointer.on) {
        const reach = link * 1.35;
        for (const s of stars) {
          if (!s.linker) continue;
          const d = Math.hypot(s.x - pointer.x, s.y - pointer.y);
          if (d > reach) continue;
          ctx.strokeStyle = `rgba(${tint(s.x)},${(1 - d / reach) * 0.6})`;
          ctx.beginPath(); ctx.moveTo(pointer.x, pointer.y); ctx.lineTo(s.x, s.y); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(238,235,255,0.9)';
        ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 1.6, 0, Math.PI * 2); ctx.fill();
      }

      // Stars, gently twinkling
      for (const s of stars) {
        const tw = 0.55 + 0.45 * Math.sin(now * 0.001 * s.rate + s.phase);
        const a = (s.linker ? 0.45 + 0.55 * tw : 0.25 + 0.4 * tw) * intro * (0.55 + 0.45 * calm(s.x, s.y));
        ctx.fillStyle = `rgba(238,235,255,${a})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }

      if (!reduce) {
        if (!spark && now > nextSpark) startSpark(now);
        if (spark) drawSpark(now);
        requestAnimationFrame(frame);
      }
    }

    addEventListener('resize', resize);
    addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true; if (reduce) frame(performance.now()); });
    addEventListener('pointerdown', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true; });
    addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') setTimeout(() => (pointer.on = false), 900); });
    document.addEventListener('pointerleave', () => (pointer.on = false));
    document.documentElement.addEventListener('mouseleave', () => (pointer.on = false));

    resize();
    if (!reduce) requestAnimationFrame(frame);

    console.log('%cYou found a hidden star. Curious people are exactly who we’re looking for: sean@rallylabs.ai',
      'color:#00F5D4;font:14px/1.5 Georgia,serif');
  })();
  </script>
